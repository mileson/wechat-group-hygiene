<text x="78" y="864" font-size="17" fill="#648073" font-weight="400">Selections and follow-up marks stay local; protected members remain review-only.</text>
<rect x="1190" y="155" width="355" height="162" rx="14" fill="#eef7f1" stroke="#d2e2da" stroke-width="2"/>
<text x="1212" y="187" font-size="21" fill="#19392e" font-weight="700">1  Source checks</text>
<text x="1212" y="219" font-size="19" fill="#19392e" font-weight="400">先核验源数据</text>
<text x="1212" y="254" font-size="16" fill="#587065" font-weight="400">Rendering checks shape + totals.</text>
<text x="1212" y="284" font-size="16" fill="#587065" font-weight="400">页面不能替代采集核验。</text>
<rect x="1190" y="340" width="355" height="162" rx="14" fill="#eef7f1" stroke="#d2e2da" stroke-width="2"/>
<text x="1212" y="372" font-size="21" fill="#19392e" font-weight="700">2  View the evidence</text>
<text x="1212" y="404" font-size="19" fill="#19392e" font-weight="400">点开消息证据</text>
<text x="1212" y="439" font-size="16" fill="#587065" font-weight="400">Inspect the original context.</text>
<text x="1212" y="469" font-size="16" fill="#587065" font-weight="400">结合上下文再判断。</text>
<rect x="1190" y="525" width="355" height="162" rx="14" fill="#eef7f1" stroke="#d2e2da" stroke-width="2"/>
<text x="1212" y="557" font-size="21" fill="#19392e" font-weight="700">3  Protected members</text>
<text x="1212" y="589" font-size="19" fill="#19392e" font-weight="400">保护成员单独看</text>
<text x="1212" y="624" font-size="16" fill="#587065" font-weight="400">New / retained / exempt.</text>
<text x="1212" y="654" font-size="16" fill="#587065" font-weight="400">不进入可处理名单。</text>
<rect x="1190" y="710" width="355" height="162" rx="14" fill="#eef7f1" stroke="#d2e2da" stroke-width="2"/>
<text x="1212" y="742" font-size="21" fill="#19392e" font-weight="700">4  Prepare a draft</text>
<text x="1212" y="774" font-size="19" fill="#19392e" font-weight="400">填人数、检查、复制</text>
<text x="1212" y="809" font-size="16" fill="#587065" font-weight="400">No automatic account actions.</text>
<text x="1212" y="839" font-size="16" fill="#587065" font-weight="400">本地标记不代表已移出。</text>
